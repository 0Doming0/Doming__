<!DOCTYPE html>
<html>
   <head>
    <title>Base64 decode qrcode</title>
   </head>
   <style>
    body{
        margin:0;
        padding:0;
        display:flex;
        justify-content:center;
        flex-wrap:wrap;
        background-color:red;
    }
    div{
       background-color:blue;
       width:40px;
       height:40px;
       opacity: 0.5; 
       transition: opacity 0.2s ease;
    }
    div:hover{
        opacity:1;
    }
   </style>
   <body>
      <div></div>
    
   </body>
   <script>
    for(let x=0; x < 1000/2; x++){
     pixel= document.createElement('div');
     document.body.appendChild(pixel);
    }
    var mouse_status;
    document.onmouseup = ()=> mouse_status=false;
    document.onmousedown = ()=> mouse_status=true;
    document.activeElement.addEventListener("mouseover",(element)=>{
        if (mouse_status)
        element.target.style.opacity= 1;
    document.activeElement.addEventListener("click", (element)=>{
        element.target.style.opacity= 1;
    })
    })
     

   </script>
</html>
