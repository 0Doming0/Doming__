[dev]
functions = "src/functions"
publish = "public"

[build]
functions = "src/functions"
publish = "public"

# Portfolio mode: the public root opens the restored, safe English demo.
[[redirects]]
  from = "/"
  to = "/demo/"
  status = 302
  force = true

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200
  force = true
  headers = { Content-Type = "application/javascript" }

[[redirects]]
  from = "/:restaurant/restaurantManager/:classe"
  to = "restaurant/restaurantManager/:classe"
  status = 200

[[redirects]]
  from = "/:restaurant/solicitar-pedido"
  to = ".netlify/functions/"

[[redirects]]
  from = "/:restaurant/client-request/:classe"
  to = "restaurant/client-request/:classe"
  status = 200

[[redirects]]
  from = "/tste/*"
  to = "tste/:splat"
  status = 301
