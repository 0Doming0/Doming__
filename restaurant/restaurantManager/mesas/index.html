<!DOCTYPE html>
<html lang='en'>
 <head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Meu negócio</title>
    
    <link rel="stylesheet" href="styles.css">
 </head>    
  <body>
    <!-- Barra de seleção principal -->
    <div id='mainPrincipal_block'><h1 style='margin-left:10px;'>{{nameRestaurant}}</h1>
      <div>
      <form action="/{{nameRestaurant}}/restaurantManager/mesas">
        <h3 onclick='click_Seletor(this)'>Mesas</h3>
      </form>
      <form action="/{{nameRestaurant}}/restaurantManager/pedidos">
        <h3 onclick='click_Seletor(this)'>Pedidos</h3>
      </form>
      <form action="/{{nameRestaurant}}/restaurantManager/cardápio">
        <h3 onclick='click_Seletor(this)'>Cardápio</h3>
      </form>
      </div>
    </div>

    <!-- Catálogo de Mesas -->
    <div id='catalogo_Mesas'>
      <div class="flex_block flexSize_M">
        <ul id="tableMenu_block">

        </ul>
        <form id='formulário' target='_blank'><input name='mesa'></form>
        <button onclick="addMesa(this)" name="adicionar_mesa">adicionar mesa</button>
        <li id="tableInfo_block"><span>2.Item</span>
          <div id="requestGarçom">solicitando garçom</div>
          <div id="mesa_information">Aqui poderá ver como estão suas mesas em tempo real</div>
          <h3 id="name_client"></h3>
          <p id="descricao_client"></p>
          <h3 id="precoInfo">R$ 15.50</h3>
          <div class="separator_line"></div>
          <img style="width:100%;" id="image_qrcode_mesa">
          <button id="button_entregar_pedido" name="entregar_pedido" onclick="entregar_pedido()">Pedido Entregue!</button>
        </li>
      </div>
    </div>
    <script>restaurant="{{nameRestaurant}}";cnpj="{{cnpjRestaurant}}";
      var Tamanho = '5px';
    </script>

    <script src="script.js"></script>
    </body>


<html>
