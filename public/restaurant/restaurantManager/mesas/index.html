  <script>
    let execução = false
    function mesa_focus (main) {
      container = document.getElementsByClassName("mesa-container_info")[0]
      container.style.display = "block"
      main.classList.toggle("mesa-main_focus")
      if (main.classList.contains("mesa-main_focus")) 
        Array.from(main.parentNode.children).forEach((elemento) => {
          if (elemento != main)
           if (elemento.classList.contains("mesa-main_focus"))
             elemento.classList.remove("mesa-main_focus")
        })
      container.querySelector ("a[name='options']").classList.add("active_button")
      container.querySelector ("a[name='options']").style.border = "none"
      if (execução) return
      if (container.classList.contains("active-container")) {
        container.classList.remove("active-container")
        container.classList.add("disable-container")
      }
      else {
        container.classList.add("active-container")
        container.classList.remove("disable-container")
      }
      execução = true
      setTimeout(() => {
        execução=false
        if (main.classList.contains("mesa-main_focus")) {
          container.classList.add("active-container")
          container.classList.remove("disable-container")
        }
        else {
          container.classList.remove("active-container")
          container.classList.add("disable-container")
        }
      }, 400) 
  }
    
  </script>
