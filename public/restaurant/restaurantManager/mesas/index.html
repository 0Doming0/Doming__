<div class = "mesa-container_info"><a name = "options"onclick = "expandir_recolher(this);mesa_disable_all()" class = "active_button"></a>

  <header>

    <a class = "active" href = "/Lacro/restaurantManager/mesas"><img name = "mesas" src = "https://th.bing.com/th?id=OIP.x90ERrGDs5DxuTtF3b1-lAHaHa&w=250&h=250&c=8&rs=1&qlt=90&o=6&pid=3.1&rm=2">

    </div>

    </div>
  </section>
    <div name = "class">Estatísticas</div>
    <div name = "class">Clientes no restaurante</div>
  </header>
  <script>
    let execução = false
    function mesa_focus (main) {
      container = document.getElementsByClassName("mesa-container_info")[0]
      container.style.display = "block"
      main.classList.toggle("mesa-main_focus")
      if (main.classList.contains("mesa-main_focus")) 
        Array.from(main.parentNode.children).forEach((elemento) => {
          if (elemento != main)
           if (elemento.classList.contains("mesa-main_focus"))
             elemento.classList.remove("mesa-main_focus")
        })
      container.querySelector ("a[name='options']").classList.add("active_button")
      container.querySelector ("a[name='options']").style.border = "none"
      if (execução) return
      if (container.classList.contains("active-container")) {
        container.classList.remove("active-container")
        container.classList.add("disable-container")
      }
      else {
        container.classList.add("active-container")
        container.classList.remove("disable-container")
      }
      execução = true
      setTimeout(() => {
        execução=false
        if (main.classList.contains("mesa-main_focus")) {
          container.classList.add("active-container")
          container.classList.remove("disable-container")
        }
        else {
          container.classList.remove("active-container")
          container.classList.add("disable-container")
        }
      }, 400) 
  }
    function mesa_disable_all () {
      const section = document.getElementsByClassName("section-page")[0]
      Array.from(section.children).forEach((mesa) => {
        if (mesa.classList.contains("mesa-main_focus"))
          mesa.classList.remove("mesa-main_focus")
      })
    }
  </script>
  <script src="/restaurant/restaurantManager/mesas/scripts.js" type = "module"></script>
  <script src = "/static/resources/scripts-manager.js"></script>
  </body>
